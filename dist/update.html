<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3455dc"><title>Update your course · A2 Key</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#26344b;font:16px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:650px;margin:10vh auto;padding:28px}section{padding:30px;background:white;border:1px solid #dce4f1;border-radius:24px}h1{margin:0 0 16px;font-size:30px}p{color:#53637c}button,a{font:inherit;min-height:48px;padding:12px 18px;border-radius:12px}button{color:#3455dc;border:1px solid #dce4f1;background:white;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{display:inline-block;background:#3455dc;color:white;text-decoration:none}[hidden]{display:none!important}:focus-visible{outline:3px solid #ecaa20;outline-offset:3px}
</style>
</head>
<body><main><section><h1>Update your course</h1><p>Check for a course update while keeping your progress, word marks and downloaded audio. Stay online; this can take about a minute.</p><p id="status" role="status" aria-live="polite">Checking for updates…</p><button id="retry" type="button" disabled>Check again</button> <a id="open" href="index.html" hidden>Open updated course →</a></section></main>
<script>
// This new page can load through an older worker without clearing any user data.
(() => {
  const status=document.getElementById('status'),retry=document.getElementById('retry'),open=document.getElementById('open');
  async function update(){
    retry.disabled=true;open.hidden=true;
    status.textContent='Checking and preparing the latest course…';
    try{
      if(!('serviceWorker' in navigator)||!window.isSecureContext)throw new Error('Open this page at its HTTPS address in a browser that supports offline courses.');
      const root=new URL('./',location.href);
      const registration=await navigator.serviceWorker.register(new URL('sw.js',root),{scope:root.pathname,updateViaCache:'none'});
      if(!registration.installing)await registration.update();
      const worker=registration.installing||registration.waiting||registration.active;
      if(!worker)throw new Error('The update has not started. Stay online and try again.');
      await new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>finish(new Error('The update is taking longer than expected. Stay online and try again. Saved records are kept.')),90000);
        function finish(error){clearTimeout(timer);worker.removeEventListener('statechange',check);error?reject(error):resolve();}
        function check(){if(worker.state==='activated')finish();else if(worker.state==='redundant')finish(new Error('The update did not finish. Please try again.'));}
        worker.addEventListener('statechange',check);check();
      });
      status.textContent='Your course is up to date. Open it below. Your progress and downloaded audio have been kept.';
      open.hidden=false;
    }catch(error){status.textContent=error.message;}
    finally{retry.disabled=false;}
  }
  retry.onclick=update;update();
})();
</script>
</body></html>
